<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MerchantHaus — Payments Anywhere & Everywhere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-crimson: #DC143C;
      --brand-teal: #00CEDB;
      --gap: 16px;
    }
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Inter', system-ui;
      background: #0f0f10;
      color: #fff;
    }
    header {
      background: #111;
      padding: 16px 24px;
      font-weight: 600;
    }
    /* --- Base Hero Layout (Mobile First) --- */
    .hero {
      position: relative;
      min-height: 86svh;
      display: grid;
      grid-template-rows: 1fr auto;
      overflow: hidden;
    }
    .hero__bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: opacity .4s ease, transform .4s ease;
    }
    .hero__bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, .55), rgba(0, 0, 0, .35) 40%, rgba(0, 0, 0, .55));
    }
    .content {
      position: relative;
      z-index: 2;
      padding: clamp(16px, 3vw, 48px);
      max-width: 1100px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: .75rem;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, .45))
    }
    .brand svg {
      width: 44px;
      height: 44px
    }
    .brand-name {
      font-family: 'Ubuntu', sans-serif;
      font-weight: 700;
      font-size: clamp(1.6rem, 2.6vw, 2.5rem)
    }
    .tag {
      display: block;
      margin-top: .25rem;
      margin-left: 56px;
      font: 500 .95rem 'Inter', sans-serif;
      color: #ffffffcc;
      letter-spacing: .18em
    }
    h1 {
      font-family: 'Ubuntu', sans-serif;
      font-size: clamp(2.2rem, 5.2vw, 4.2rem);
      margin: 12px 0 8px
    }
    p {
      max-width: 55ch;
      opacity: .92
    }
    .cta {
      display: flex;
      gap: .75rem;
      margin-top: 1rem
    }
    .btn {
      border: none;
      border-radius: 999px;
      padding: .9rem 1.4rem;
      font-weight: 700;
      cursor: pointer
    }
    .primary {
      background: var(--brand-crimson);
      color: #fff;
      box-shadow: 0 16px 30px rgba(220, 20, 60, .25)
    }
    .ghost {
      background: #ffffff18;
      border: 1px solid #ffffff33;
      color: #fff
    }
    /* --- Carousel area --- */
    .rail {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      padding: 0 16px 24px;
    }
    .arrows {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .arrow {
      width: 48px;
      height: 48px;
      border-radius: 999px;
      border: 1px solid #ffffff33;
      background: #ffffff18;
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform .3s ease;
    }
    .arrow:focus-visible {
      outline: 3px solid var(--brand-teal);
      outline-offset: 2px;
    }
    .viewport {
      flex: 1;
      display: flex;
      gap: var(--gap);
      overflow: hidden;
      scroll-behavior: smooth;
    }
    .card {
      flex-shrink: 0;
      border-radius: 16px;
      background: #222 center/cover;
      box-shadow: 0 12px 24px rgba(0, 0, 0, .35);
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
      aspect-ratio: 3 / 4; /* UPDATED ASPECT RATIO */
    }
    .card:hover {
      transform: scale(1.03);
    }
    .card.active {
        box-shadow: 0 0 0 3px var(--brand-teal), 0 12px 24px rgba(0,0,0,.35);
        transform: scale(1.03);
    }
    
    /* Card sizing for different breakpoints */
    .card {
      flex-basis: calc((100% - var(--gap)) / 2.2);
    }
    @media (min-width: 600px) {
      .card {
        flex-basis: calc((100% - var(--gap) * 3) / 4);
      }
    }

    /* --- Desktop Layout (>=1024px): Right-side Vertical Carousel --- */
    @media (min-width: 1024px) {
      .hero {
        grid-template-columns: minmax(auto, 55ch) 1fr;
        grid-template-rows: 1fr;
        align-items: center;
        gap: 32px;
        padding: 0 clamp(16px, 3vw, 48px);
      }
      .content {
        max-width: 100%;
      }
      .rail {
        flex-direction: column;
        align-self: stretch;
        justify-content: center;
        padding: 0;
        gap: 16px;
      }
      .viewport {
        flex-direction: column;
        overflow-y: hidden;
        overflow-x: visible;
        max-height: 80vh;
        width: 240px;
      }
      .card {
        width: 100%;
        flex-basis: auto;
      }
      .arrows {
        order: 1; /* Move arrows below the viewport */
        flex-direction: row;
      }
      #left {
        transform: rotate(-90deg); /* Becomes Up Arrow */
      }
      #right {
        transform: rotate(90deg); /* Becomes Down Arrow */
      }
    }
  </style>
</head>
<body>
  <header>MerchantHaus — Sample Header</header>

  <section class="hero" aria-label="MerchantHaus payments hero">
    <div id="bg" class="hero__bg" aria-hidden="true"></div>

    <div class="content">
      <div class="brand">
        <svg viewBox="0 0 90 90" role="img" aria-label="MerchantHaus shield">
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#DC143C"/><stop offset="50%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#DC143C"/></linearGradient></defs>
          <path d="M45 5 L78 20 L78 52 L45 85 L12 52 L12 20 Z" fill="url(#g)"/>
        </svg>
        <div>
          <div class="brand-name">MerchantHaus</div>
          <small class="tag">plug. play. grow.</small>
        </div>
      </div>
      <h1 id="title">Payments Anywhere & Everywhere</h1>
      <p id="sub">Accept cards, ACH and contactless. POS, mobile and online — unified and secure.</p>
      <div class="cta">
        <button class="btn primary">Get a Quote</button>
        <button class="btn ghost">Learn More</button>
      </div>
    </div>

    <div class="rail">
      <div class="arrows">
        <button class="arrow" id="left" aria-label="Previous">◀</button>
        <button class="arrow" id="right" aria-label="Next">▶</button>
      </div>
      <div class="viewport" id="cards">
        <div class="card" data-title="Payments Anywhere & Everywhere" data-sub="Accept cards, ACH and contactless. POS, mobile and online — unified and secure." data-img="assets/omg/Card1land.webp"></div>
        <div class="card" data-title="AI-Powered Fraud Detection" data-sub="Leverage machine learning to protect your business and your customers." data-img="assets/omg/Card2land.webp"></div>
        <div class="card" data-title="Seamless Mobile Commerce" data-sub="Empower your sales on the go with our robust mobile payment solutions." data-img="assets/omg/Card3land.webp"></div>
        <div class="card" data-title="Flexible Payment Options" data-sub="From credit cards to ACH and checks, we've got all your payment needs covered." data-img="assets/omg/Card4land.webp"></div>
        <div class="card" data-title="Hundreds of Integrations" data-sub="Connect with the tools you already use to streamline your entire workflow." data-img="assets/omg/Card5land.webp"></div>
        <div class="card" data-title="Advanced Point of Sale" data-sub="Modernize your in-person transactions with our powerful POS systems." data-img="assets/omg/Card6land.webp"></div>
      </div>
    </div>
  </section>

  <script>
    // --- DOM ELEMENT SELECTORS ---
    const qs = s => document.querySelector(s);
    const cardsContainer = qs('#cards');
    const allCards = [...cardsContainer.querySelectorAll('.card')];
    const bg = qs('#bg');
    const left = qs('#left');
    const right = qs('#right');
    const title = qs('#title');
    const sub = qs('#sub');

    // --- STATE MANAGEMENT ---
    let heroIndex = 0;
    const numCards = allCards.length;
    let isAnimating = false; // Prevents spamming clicks during animations

    // --- CORE FUNCTIONS ---

    // 1. Set background images on all cards once on load
    function hydrate() {
      allCards.forEach(c => {
        c.style.backgroundImage = `url('${c.dataset.img}')`;
      });
    }

    // 2. Update the main hero content based on a card's data
    function setHero(index) {
      const card = allCards[index];
      if (!card) return;

      // Fade out, update content, then fade in
      bg.style.opacity = '0';
      bg.style.transform = 'scale(1.03)';
      setTimeout(() => {
        bg.style.backgroundImage = `url('${card.dataset.img}')`;
        title.textContent = card.dataset.title;
        sub.textContent = card.dataset.sub;
        bg.style.opacity = '1';
        bg.style.transform = 'scale(1)';
      }, 200); // This delay should match the transition time in CSS
    }
    
    // 3. Main function to update visuals and state
    function updateState(newHeroIndex) {
      if (isAnimating) return;
      isAnimating = true;

      // The highlighted card is always the one after the current hero
      const newHighlightedIndex = (newHeroIndex + 1) % numCards;

      // Update state
      heroIndex = newHeroIndex;

      // Update the active class to highlight the upcoming card
      allCards.forEach(c => c.classList.remove('active'));
      allCards[newHighlightedIndex].classList.add('active');
      
      const cardToFocus = allCards[newHighlightedIndex];
      const isDesktop = window.matchMedia('(min-width: 1024px)').matches;

      // Scroll the container to center the newly highlighted card
      if (isDesktop) {
        cardsContainer.scrollTo({
          top: cardToFocus.offsetTop - (cardsContainer.offsetHeight / 2) + (cardToFocus.offsetHeight / 2),
          behavior: 'smooth'
        });
      } else {
        cardsContainer.scrollTo({
          left: cardToFocus.offsetLeft - (cardsContainer.offsetWidth / 2) + (cardToFocus.offsetWidth / 2),
          behavior: 'smooth'
        });
      }

      // After a delay to allow for the scroll animation, update the hero content
      setTimeout(() => {
        setHero(heroIndex);
        isAnimating = false; // Allow new selections
      }, 400);
    }
    
    // 4. Handle arrow navigation
    function move(dir) {
      // dir is 1 for next, -1 for previous
      const newHeroIndex = (heroIndex + dir + numCards) % numCards;
      updateState(newHeroIndex);
    }

    // 5. Handle direct card click
    function handleCardClick(clickedIndex) {
      // When a card is clicked, it becomes the highlighted one (the next hero).
      // The hero to display now is the one right before the clicked card.
      const newHeroIndex = (clickedIndex - 1 + numCards) % numCards;
      if (newHeroIndex === heroIndex) return; // Do nothing if it would result in no change
      updateState(newHeroIndex);
    }

    // --- EVENT LISTENERS ---
    right.addEventListener('click', () => move(1));
    left.addEventListener('click', () => move(-1));
    allCards.forEach((card, index) => {
      card.addEventListener('click', () => handleCardClick(index));
    });

    // --- INITIALIZATION ---
    function init() {
        hydrate();
        // Initialize with the first hero and highlight the second card
        updateState(0); 
    }
    
    init();
  </script>
</body>
</html>
