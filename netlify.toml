[build]
  command = "npm run lint && npm test"
  publish = "."
  functions = "netlify/functions"   # points to the netlify/functions folder

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://unpkg.com https://cdn.openwidget.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests"

[[redirects]]
  from = "/integrations"
  to = "/#integrations"
  status = 301

[[redirects]]
  from = "/index.php"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/shopify.php"
  to = "/shopify.html"
  status = 301

[[redirects]]
  from = "/Shopify.html"
  to = "/shopify.html"
  status = 301

[[redirects]]
  from = "/gohighlevel.php"
  to = "/gohighlevel.html"
  status = 301

[[redirects]]
  from = "/faq.php"
  to = "/faq.html"
  status = 301

[[redirects]]
  from = "/apply.php"
  to = "/apply.html"
  status = 301

[[redirects]]
  from = "/compliance.php"
  to = "/compliance.html"
  status = 301

[[redirects]]
  from = "/privacy.php"
  to = "/privacy.html"
  status = 301

[[redirects]]
  from = "/terms.php"
  to = "/terms.html"
  status = 301

[[redirects]]
  from = "/integrations/shopify.php"
  to = "/integrations/shopify.html"
  status = 301

[[redirects]]
  from = "/integrations/gohighlevel.php"
  to = "/integrations/gohighlevel.html"
  status = 301
