[build]
  command = "npm run lint && npm test && npm run build"
  publish = "dist"
  functions = "functions"   # points to the root-level functions folder

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/integrations"
  to = "/#integrations"
  status = 301

[[redirects]]
  from = "/index.php"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/shopify.php"
  to = "/Shopify.html"
  status = 301

[[redirects]]
  from = "/gohighlevel.html"
  to = "/gohighlevel.php"
  status = 301

[[redirects]]
  from = "/faq.php"
  to = "/faq.html"
  status = 301

[[redirects]]
  from = "/apply.php"
