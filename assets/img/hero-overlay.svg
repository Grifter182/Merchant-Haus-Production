<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <pattern id="geometric-pattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Diagonal lines in brand crimson -->
      <g stroke="#DC143C" stroke-width="2" fill="none" opacity="0.3">
        <line x1="0" y1="0" x2="50" y2="50"/>
        <line x1="50" y1="0" x2="100" y2="50"/>
        <line x1="0" y1="50" x2="50" y2="100"/>
        <line x1="50" y1="50" x2="100" y2="100"/>
      </g>
      <!-- Diamond shapes in brand teal -->
      <g stroke="#00CEDB" stroke-width="1.5" fill="none" opacity="0.2">
        <polygon points="25,12.5 37.5,25 25,37.5 12.5,25"/>
        <polygon points="75,12.5 87.5,25 75,37.5 62.5,25"/>
        <polygon points="25,62.5 37.5,75 25,87.5 12.5,75"/>
        <polygon points="75,62.5 87.5,75 75,87.5 62.5,75"/>
      </g>
      <!-- Small circles for texture -->
      <g fill="#DC143C" opacity="0.1">
        <circle cx="20" cy="20" r="3"/>
        <circle cx="80" cy="20" r="3"/>
        <circle cx="50" cy="50" r="3"/>
        <circle cx="20" cy="80" r="3"/>
        <circle cx="80" cy="80" r="3"/>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#geometric-pattern)"/>
</svg>